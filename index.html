<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Система - novosty-top.ru</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            min-height: 90vh;
        }

        /* Левая панель */
        .sidebar {
            width: 280px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            padding: 30px 20px;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
        }

        .menu-button {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .menu-button:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(5px);
        }

        .menu-button.active {
            background: #3498db;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }

        .menu-button::before {
            content: '📊';
            font-size: 20px;
        }

        .menu-button:nth-child(3)::before {
            content: '✅';
        }

        .menu-button:nth-child(4)::before {
            content: '➕';
        }

        /* Правая панель */
        .content {
            flex: 1;
            padding: 40px;
            background: #f8f9fa;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 32px;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .header p {
            color: #7f8c8d;
            font-size: 16px;
        }

        /* Таблица */
        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
            overflow-y: visible;
        }

        .table-container::-webkit-scrollbar {
            height: 8px;
        }

        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        .table-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        thead th {
            padding: 20px;
            text-align: left;
            font-weight: 600;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        tbody tr {
            border-bottom: 1px solid #ecf0f1;
            transition: all 0.3s ease;
        }

        tbody tr:hover {
            background: #f8f9fa;
            transform: scale(1.01);
        }

        tbody td {
            padding: 18px 20px;
            color: #2c3e50;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            display: inline-block;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            margin-bottom: 25px;
            color: #2c3e50;
            font-size: 24px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #3498db;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #2c3e50;
        }

        .btn-secondary:hover {
            background: #bdc3c7;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #7f8c8d;
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                padding: 20px;
            }

            .content {
                padding: 20px;
            }

            table {
                font-size: 12px;
            }

            thead th, tbody td {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Левая панель -->
        <div class="sidebar">
            <div class="logo">CRM Система</div>
            <button class="menu-button active" onclick="showAll()">Показать всех</button>
            <button class="menu-button" onclick="showActive()">Показать активных</button>
            <button class="menu-button" onclick="openModal()">Добавить новый контакт</button>
        </div>

        <!-- Правая панель -->
        <div class="content">
            <div class="header">
                <h1 id="contentTitle">Все контакты</h1>
                <p id="contentSubtitle">Управление базой клиентов</p>
            </div>

            <div class="table-container">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Имя</th>
                            <th>Email</th>
                            <th>Телефон</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Данные загружаются через JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Добавить новый контакт</h2>
            <form id="addUserForm">
                <div class="form-group">
                    <label for="userName">Имя</label>
                    <input type="text" id="userName" required>
                </div>
                <div class="form-group">
                    <label for="userEmail">Email</label>
                    <input type="email" id="userEmail" required>
                </div>
                <div class="form-group">
                    <label for="userPhone">Телефон</label>
                    <input type="tel" id="userPhone" required>
                </div>
                <div class="form-group">
                    <label for="userStatus">Статус</label>
                    <select id="userStatus" required>
                        <option value="active">Активный</option>
                        <option value="inactive">Неактивный</option>
                    </select>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Отмена</button>
                    <button type="submit" class="btn btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let usersData = [];

        // Загрузка данных из API
        async function loadUsers() {
            try {
                const response = await fetch('/api/users');
                if (!response.ok) {
                    throw new Error('Ошибка загрузки');
                }
                const data = await response.json();
                usersData = data.users;
                showAll();
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
                document.getElementById('tableBody').innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">⚠️</div>
                            <p>Ошибка загрузки данных: ${error.message}</p>
                        </td>
                    </tr>
                `;
            }
        }

        // Отображение всех пользователей
        function showAll() {
            updateActiveButton(0);
            document.getElementById('contentTitle').textContent = 'Все контакты';
            document.getElementById('contentSubtitle').textContent = `Всего контактов: ${usersData.length}`;
            displayUsers(usersData);
        }

        // Отображение активных пользователей
        function showActive() {
            updateActiveButton(1);
            const activeUsers = usersData.filter(user => user.status === 'active');
            document.getElementById('contentTitle').textContent = 'Активные контакты';
            document.getElementById('contentSubtitle').textContent = `Активных контактов: ${activeUsers.length}`;
            displayUsers(activeUsers);
        }

        // Отображение пользователей в таблице
        function displayUsers(users) {
            const tableBody = document.getElementById('tableBody');
            
            if (users.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state">
                            <div class="empty-state-icon">📭</div>
                            <p>Нет контактов для отображения</p>
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = users.map(user => `
                <tr>
                    <td>${user.id}</td>
                    <td>${user.name}</td>
                    <td>${user.email}</td>
                    <td>${user.phone}</td>
                    <td>
                        <span class="status-badge ${user.status === 'active' ? 'status-active' : 'status-inactive'}">
                            ${user.status === 'active' ? 'Активный' : 'Неактивный'}
                        </span>
                    </td>
                </tr>
            `).join('');
        }

        // Обновление активной кнопки
        function updateActiveButton(index) {
            const buttons = document.querySelectorAll('.menu-button');
            buttons.forEach((btn, i) => {
                if (i === index) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Открытие модального окна
        function openModal() {
            updateActiveButton(2);
            document.getElementById('modal').classList.add('active');
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            document.getElementById('addUserForm').reset();
            showAll();
        }

        // Обработка формы добавления пользователя
        document.getElementById('addUserForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const newUser = {
                name: document.getElementById('userName').value,
                email: document.getElementById('userEmail').value,
                phone: document.getElementById('userPhone').value,
                status: document.getElementById('userStatus').value
            };

            console.log('Отправка данных:', newUser);

            try {
                const response = await fetch('/api/users', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(newUser)
                });

                console.log('Статус ответа:', response.status);

                if (response.ok) {
                    const result = await response.json();
                    console.log('Результат:', result);
                    alert('Контакт успешно добавлен!');
                    await loadUsers();
                    closeModal();
                } else {
                    const errorData = await response.json();
                    console.error('Ошибка от сервера:', errorData);
                    alert('Ошибка при добавлении контакта: ' + (errorData.error || 'Неизвестная ошибка'));
                }
            } catch (error) {
                console.error('Ошибка сети:', error);
                alert('Ошибка при добавлении контакта: ' + error.message);
            }
        });

        // Закрытие модального окна при клике вне его
        document.getElementById('modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Загрузка данных при загрузке страницы
        window.addEventListener('load', loadUsers);
    </script>

</body>
</html>
